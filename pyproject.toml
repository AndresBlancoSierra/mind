[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mind"
version = "0.1.0"
description = "MIND - automated knowledge mastery platform (Phase 1: search, download, process, local AI filtering)"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings[yaml]>=2.0.0",
    # Web
    "httpx>=0.27.0",
    "ddgs>=9.0.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # PDF
    "PyMuPDF>=1.24.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
mind = "mind.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mind"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that hit live network resources (deselect with '-m not network')",
    "llm: tests that require a running local LLM runtime (deselect with '-m not llm')",
    "ocr: tests that require tesseract (deselect with '-m not ocr')",
]
