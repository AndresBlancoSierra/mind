<text x="340" y="235" fill="#f4f4f5" font-size="16" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="340" y="235" class="glitch" fill="#f4f4f5">~/</tspan><tspan class="glitch" fill="#f4f4f5">mind</tspan><tspan class="cursor" fill="#71717a">▌</tspan><tspan fill="#a1a1aa"> ───────────────────────────</tspan><tspan x="340" y="265" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">About</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">Automated knowledge-mastery platform (Phase /</tspan><tspan x="368.8" y="289" fill="#f4f4f5">1): search, download, process and filter with</tspan><tspan x="368.8" y="313" fill="#f4f4f5">/ local AI. Search + extraction + OCR + /</tspan><tspan x="368.8" y="337" fill="#f4f4f5">filtering pipeline with API and web app.</tspan><tspan x="340" y="361" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Type</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">Platform · API + web</tspan><tspan x="340" y="385" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Lang</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">Python</tspan><tspan x="340" y="409" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Status</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">Active</tspan><tspan x="340" y="433" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Author</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">Andrés Blanco</tspan><tspan x="340" y="457" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Pipeline</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">search · extract · ocr · filter</tspan><tspan x="340" y="481" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">AI</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">local models</tspan><tspan x="340" y="505" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">API</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">FastAPI</tspan><tspan x="340" y="529" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Frontend</tspan><tspan